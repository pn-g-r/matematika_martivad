plugins:
  - search:
      lang:
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - build: true
          default: true
          locale: en
          name: English
#        - build: true
#          default: false
#          locale: ka
#          name: Georgian
#          nav_translations:
#            Home: მთავარი გვერდი
#            Online payments: ონლაინ გადახდები
#            Get started: დაიწყეთ
#            CMS plugins: CMS დანამატები
#            Subscription & Recurring: გამოწერა და განმეორებადი
      reconfigure_material: true
      reconfigure_search: true
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Home page. Explore the methods to integrate Flitt:
        - index.md # How to start & Testing. Redirect, embedded, direct
        API Reference:
        - api/*.md
        Mobile SDKs:
        - api/mobile/*.md
        SDKs for frontend and backend:
        - sdk-and-mobile/sdk/*.md
        Getting started:
        - getting-started/*.md
        CMS plugins:
        - no-code/*.md
        Other pages:
        - bug-bounty.md
        - pcidss-compliance.md
        - flitt-payments-integration-skill.md
        - supported-countries.md
        - supported-payment-systems.md
        - llms.md



markdown_extensions:
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  #  - pymdownx.superfences
  - pymdownx.highlight:
      extend_pygments_lang:
        - name: php-inline
          lang: php
          options:
            startinline: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.tasklist:
      custom_checkbox: true
