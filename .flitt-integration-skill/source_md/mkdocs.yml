site_name: Payment API reference
site_url: https://docs.flitt.com
site_description: Flitt payment API Reference.
repo_url: https://github.com/flittpayments

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/flitt_dark
  favicon: static/img/favicon.ico
  #  font:
  #    text: GrtskPeta
  features:
    - navigation.top
    - content.tooltips
    - content.tabs.link
    - content.code.copy
#    - navigation.tabs
#    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to dark mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/lightbulb
        name: Switch to system preference

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode

extra_css:
  - static/assets/extra.css
extra:
  analytics:
    provider: custom
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/flittpayments/
      name: Flitt on Github
    - icon: fontawesome/brands/discourse
      link: https://flitt.discourse.group/
      name: Flitt Community for developers
nav:
  - Home: index.md
  - Online payments:
      - Get started: getting-started/get-started.md
      - Redirect: getting-started/redirect.md
      - Embedded: getting-started/embedded.md
      - Direct: getting-started/direct.md
      #- Mobile: getting-started/mobile.md
      - Saving cards: getting-started/recurring.md
        #  - Flitt managed: api/subcription.md
        #  - merchant managed: api/recurring.md
    #- Design presets: getting-started/presets.md
    #- Brief description: index.md
  #- No-code:
