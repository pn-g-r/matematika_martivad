{% if paid_courses %}
<style>
  .my-lessons-nav {
    position: relative;
    display: inline-block;
    margin-right: 8px;
  }
  .my-lessons-nav__trigger {
    background: #10b981;
    border: 1px solid #10b981;
    color: #fff;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    cursor: pointer;
    font: inherit;
    padding: 10px 18px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .my-lessons-nav__trigger:hover {
    background: #059669;
    border-color: #059669;
  }
  .my-lessons-nav__chevron {
    font-size: 14px;
    transition: transform 0.2s ease;
  }
  .my-lessons-nav.is-open .my-lessons-nav__chevron {
    transform: rotate(180deg);
  }
  .my-lessons-nav__menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 240px;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    padding: 8px;
    z-index: 10000;
  }
  .my-lessons-nav.is-open .my-lessons-nav__menu {
    display: block;
  }
  .my-lessons-nav__menu-title {
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .my-lessons-nav__item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    color: #f8fafc;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.2s ease;
  }
  .my-lessons-nav__item:hover {
    background: rgba(16, 185, 129, 0.15);
    color: #6ee7b7;
  }
  .my-lessons-nav__item i {
    color: #10b981;
    font-size: 16px;
  }
</style>

{% if paid_courses|length >= 2 %}
<div class="my-lessons-nav" data-my-lessons-dropdown>
  <button type="button" class="my-lessons-nav__trigger btn primary" aria-haspopup="true" aria-expanded="false" data-my-lessons-toggle>
    <i class="bx bx-play-circle" style="font-size: 18px;"></i>
    <span>ჩემი გაკვეთილები</span>
    <i class="bx bx-chevron-down my-lessons-nav__chevron"></i>
  </button>
  <div class="my-lessons-nav__menu" role="menu">
    <div class="my-lessons-nav__menu-title">აირჩიეთ კურსი</div>
    {% for course in paid_courses %}
    <a
      href="{% url 'course_detail' pk=course.id %}#curriculum-section"
      class="my-lessons-nav__item"
      role="menuitem"
    >
      <i class="fa-solid fa-book-open"></i>
      <span>{{ course.title }}</span>
    </a>
    {% endfor %}
  </div>
</div>
<script>
  (function () {
    var root = document.querySelector("[data-my-lessons-dropdown]");
    if (!root || root.dataset.bound === "1") return;
    root.dataset.bound = "1";
    var toggle = root.querySelector("[data-my-lessons-toggle]");
    toggle.addEventListener("click", function (event) {
      event.stopPropagation();
      var isOpen = root.classList.toggle("is-open");
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });
    document.addEventListener("click", function (event) {
      if (!root.contains(event.target)) {
        root.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
      }
    });
  })();
</script>
{% else %}
<a
  href="{% url 'course_detail' pk=paid_course.id %}#curriculum-section"
  class="btn primary my-lessons-nav__trigger"
  style="margin-right: 8px;"
>
  <i class="bx bx-play-circle" style="font-size: 18px;"></i>
  <span>ჩემი გაკვეთილები</span>
</a>
{% endif %}
{% endif %}
